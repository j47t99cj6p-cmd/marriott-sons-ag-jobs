<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a3d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="AG Jobs">
<link rel="manifest" href="manifest.webmanifest"><title>Marriott & Sons AG Jobs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#172019;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#1f7a3d;color:white;padding:22px 18px 16px;padding-top:calc(22px + env(safe-area-inset-top))}
header h1{margin:0;font-size:25px}header p{margin:4px 0 0;opacity:.85}.tabs{display:flex;overflow:auto;background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:3}
.tabs button{border:0;background:white;padding:13px 14px;white-space:nowrap;font-weight:700;color:#666}.tabs button.active{color:#1f7a3d;border-bottom:3px solid #1f7a3d}
main{max-width:760px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 5px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:24px;font-weight:800}.muted{color:#6a736d;font-size:13px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd4cd;border-radius:10px;background:white;font-size:16px;margin:5px 0 12px}
label{font-size:13px;font-weight:700}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#1f7a3d;color:#fff;font-size:16px;font-weight:800}
.secondary{padding:9px 12px;border:1px solid #ccd4cd;border-radius:9px;background:white}.danger{color:#b42318;border:0;background:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{text-align:center;padding:35px 10px;color:#6a736d}
h2{margin-top:4px}
</style></head><body>
<header><h1>Marriott & Sons</h1><p>AG Jobs</p></header>
<nav class="tabs">
<button class="active" data-tab="home">Home</button><button data-tab="jobs">Jobs</button>
<button data-tab="customers">Customers</button><button data-tab="employees">Employees</button><button data-tab="reports">Reports</button>
</nav><main id="app"></main><script src="app.js"></script></body></html>
